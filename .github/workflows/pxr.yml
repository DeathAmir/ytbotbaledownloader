name: pxr

on:
  workflow_dispatch:
    inputs:
      allowed_hosts:
        required: true
        type: string

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          python -m pip install --upgrade pip
          pip install mitmproxy cryptography>=41.0.0 h2>=4.1.0 brotli>=1.1.0 zstandard>=0.22.0

      - run: |
          mkdir certs
          mitmdump --set confdir=certs --quit
          cp certs/mitmproxy-ca-cert.pem certs/mitmproxy-ca.pem

      - uses: actions/upload-artifact@v4
        with:
          name: mitmproxy-certs
          path: certs/

      - run: |
          echo "${{ github.event.inputs.allowed_hosts }}" > hosts.txt
          nohup mitmdump --listen-host 0.0.0.0 --listen-port 8089 --set confdir=certs > proxy.log 2>&1 &
          sleep 18000
