name: pxr

on:
  workflow_dispatch:
    inputs:
      allowed_hosts:
        required: true
        type: string

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          python -m pip install --upgrade pip
          pip install mitmproxy cryptography>=41.0.0 h2>=4.1.0 brotli>=1.1.0 zstandard>=0.22.0

      - run: |
          mkdir ca
          mitmdump --set confdir=ca -q &
          sleep 5
          pkill mitmdump || true

      - run: |
          echo "${{ github.event.inputs.allowed_hosts }}" > hosts.txt
          nohup mitmdump --listen-host 0.0.0.0 --listen-port 8089 --set confdir=ca > proxy.log 2>&1 &
          sleep 18000
