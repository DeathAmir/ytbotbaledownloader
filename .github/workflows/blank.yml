name: Run Bale YouTube Downloader

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
        run: python bot.py
