name: pxr2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          python -m pip install --upgrade pip
          pip install mitmproxy cryptography>=41.0.0 h2>=4.1.0 brotli>=1.1.0 zstandard>=0.22.0

      - run: |
          mkdir ca
          mitmdump --set confdir=ca -q &
          sleep 5
          pkill mitmdump || true
          cp ca/mitmproxy-ca-cert.pem ca/mitmproxy-ca.pem

      - run: |
          mkdir -p store
          cp ca/mitmproxy-ca.pem store/mitmproxy-ca.pem

      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add store/mitmproxy-ca.pem
          git commit -m update || true
          git push
