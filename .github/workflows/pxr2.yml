name: pxr2

on:
  workflow_dispatch:

jobs:
  certs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: |
          python -m pip install --upgrade pip
          pip install mitmproxy cryptography>=41.0.0 h2>=4.1.0 brotli>=1.1.0 zstandard>=0.22.0

      - run: |
          mkdir certs
          mitmdump --set confdir=certs -q &
          sleep 5
          pkill mitmdump || true
          cp certs/mitmproxy-ca-cert.pem certs/mitmproxy-ca.pem

      - uses: actions/upload-artifact@v4
        with:
          name: mitmproxy-certs
          path: certs/
